<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok Yetkilendirme · İndirim Koparan</title><link rel="stylesheet" href="assets/style.css"></head><body>
<header><div class="wrap"><div class="mark">İK</div><div><h1>TikTok Yetkilendirme</h1><p>Güvenli OAuth dönüş sayfası</p></div></div></header><main class="wrap"><section class="card"><h2 id="status">Yetkilendirme sonucu alınıyor…</h2><p id="message">Bu pencereyi kapatmadan önce yerel uygulamanın açık olduğundan emin olun.</p><p><a class="button" href="index.html">Ana sayfaya dön</a></p></section></main>
<script>(()=>{const q=new URLSearchParams(location.search);const code=q.get('code'),state=q.get('state'),error=q.get('error');const s=document.getElementById('status'),m=document.getElementById('message');if(error){s.textContent='Yetkilendirme tamamlanamadı';m.textContent='TikTok hata döndürdü. Uygulamaya dönüp yeniden deneyin.';return}if(!code){s.textContent='Yetkilendirme kodu bulunamadı';m.textContent='Bu sayfa yalnızca TikTok yetkilendirmesinden sonra kullanılmalıdır.';return}s.textContent='Yetkilendirme tamamlandı';m.textContent='Yerel uygulamaya yönlendiriliyorsunuz…';const target='http://127.0.0.1:8765/callback?'+new URLSearchParams({code,state:state||''}).toString();setTimeout(()=>location.replace(target),800)})()</script></body></html>
